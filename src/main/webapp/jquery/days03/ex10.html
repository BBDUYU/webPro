<script>
	$("button").on("click",function(){

		/* alert($("#subject").find(":selected").index());

		const sel=$("#subject");
		const opt=sel.find(":selected")
		if (opt.index() == 0) {
			alert("과목을 선택하세요.");
			return;
		  }
		let oText = opt.text();
		$("#demo").text(sel.val()+"/"+oText);
		
	})
