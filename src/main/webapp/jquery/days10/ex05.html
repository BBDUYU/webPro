  <xmp class="code">
    jq 애니메이션 - animate() 메서드
    형식)
    $("jq selector").animate({매개변수},speed,callback);
    {매개변수} : 애니메이션을 적용할 css 속성을 정의
    speed : 효과의 지속시간
    callback: 애니메이션 효과가 완료된 후 호출되는 함수
  </xmp>
</div>
<button>실행</button>
<div id="box"></div>

<script>
	//jq css 설정
	$("#box").css({
		"width":"100px",
		"height":"100px",
		"position":"absolute",
		"background-color":"aqua"
	});

	$("button").on("click",function(){
		// $("#box").animate({ left: "250px" })
		/*
		$("#box").animate({
	         left:"+=50px",
	         opacity:"0.5",

	         });
		*/
		$("#box").animate({height:"toggle"});
		
	})
</script>
