  <script>
  
  $(":text").addClass("full");
  $(":text:eq(2)").focus();
  $(":focus").css("background-color","red");
  
  $("#content div:first-of-type").css("background-color","red");
  $("#content div:eq(1)").css("background-color","green");
  $("#content div:last-of-type").css("background-color","blue");
  
  	function div_animate(){
  		$("#content div:eq(0)")
  			.animate({width:"50%"},"slow")
  			.animate({width:"100%"},"slow",div_animate)
  	};
  	
  	div_animate();
  	
  	$("button.btn1").on("click",function(){
  		$("#content div:animated")
  			.css("background-color","yellow")
  	})
  </script>
