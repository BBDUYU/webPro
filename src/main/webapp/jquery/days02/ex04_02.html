<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet" href="http://localhost/webPro/resources/cdn-main/example.css">
<script src="http://localhost/webPro/resources/cdn-main/example.js"></script>
</head>
<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
    
  </xmp>
  <label for="name">RED : </label><br />
  <input type="range" id="redrange" class="long" min="0" max="255" step="1"/><br />
  <input type="range" id="greenrange" class="long" min="0" max="255" step="1"/><br />
  <input type="range" id="bluerange" class="long" min="0" max="255" step="1"/><br />
  <p id="demo">홍길동</p>
</div>

<script>
  // rrange, greange, brange 각각 요소(객체)를 얻어와서 
  // 모두 일괄적으로 처리.. ( 수정 )
  const rgbRange = $('input[type=range][id$=range]');
  
  rgbRange.each(function(index,element){
	  $(element).on("input", pelem_bgchange)
  })
   
  const pelem = $("p");
  /*
  pelem.css("height","200px");
  pelem.css("font-size","30px");
  */
  /*
  pelem
  	.css("height","200px")
  	.css("font-size","30px");
  */
  pelem
  	.css({
  		"height":"200px","font-size":"30px"	
  	});


  const pelem_bgcolor = pelem.css("background-color");
   
  const rgbaArr =  pelem_bgcolor.match( /\d+/g).map(Number); 
  console.log( rgbaArr );
  rgbRange.eq(0).val(rgbaArr[0]) ;
  rgbRange.eq(1).val(rgbaArr[1]) ;
  rgbRange.eq(2).val(rgbaArr[2]) ;

  
  function pelem_bgchange(){
     let cred = rgbRange.eq(0).val();
     let cgreen = rgbRange.eq(1).val();
     let cblue = rgbRange.eq(2).val();
     
     pelem.css("background-color", `RGB(${cred}, ${cgreen}, ${cblue})`);
     pelem.text(`RGB(${cred}, ${cgreen}, ${cblue})`);
  }
  </script>
</body>
</html>
