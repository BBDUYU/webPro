<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>

<div>
  <xmp class="code">

  <!-- 
  <button>Turn On</button>
  <button>Turn Off</button>
  <br />
  <img alt="" src="../images/pic_bulboff.gif">
  <img alt="" src="../images/pic_bulbon.gif"> 
  -->
  </div>
  <script>
  	//1. js코딩으로 <button> Turn On</button> 요소를 생성해서 추가
  	/* const container = document.querySelector("body > div");
  	container.innerHTML="<button> Turn On</button>"; */
  	
  	const container = $("body > div");
  	const btnTurnOn = $("<button>Turn On</button>");
  	btnTurnOn.on("click",function(){
  		bulb_onoff(true);
  	});
  	container.append(btnTurnOn);
  	
  	//2. Turn Off 버튼
  	const btnTurnOff = $("<button>Turn Off</button>");
  	btnTurnOff.on("click",function(){
  		bulb_onoff(false);
  	});
  	btnTurnOff.css("display","none");
  	container.append(btnTurnOff);
  	
  	//3. br
  	container.append($("<br>"));
  	
  	//4.img
  	const imgBulb=$("<img src='../images/pic_bulboff.gif'> ");
  	container.append(imgBulb);
  	
  	function bulb_onoff(flag){
  		
  		imgBulb.attr("src","../images/pic_bulb"+ (flag?"on":"off")+".gif");
  	  	btnTurnOn.css("display",flag?"none":"inline");
  	  	btnTurnOff.css("display",flag?"inline":"none");		
  	}
  </script>
  <script>
  	imgBulb.hover(
  		function(){
  			bulb_onoff(true);
  		},
  		function(){
  			bulb_onoff(false);
  		});
  	
  </script>
</body>
