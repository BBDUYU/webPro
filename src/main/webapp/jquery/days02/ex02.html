<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2025. 11. 24. 오후 12:19:17</title>
<link rel="shortcut icon" type="image/x-icon"
	href="http://localhost/webPro/images/SiSt.ico">
<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet"
	href="http://localhost/webPro/resources/cdn-main/example.css">
<script src="http://localhost/webPro/resources/cdn-main/example.js"></script>
</head>
<body>
	<header>
		<h1 class="main">
			<a href="#" style="position: absolute; top: 30px;">Home</a>
		</h1>
		<ul>
			<li><a href="#">로그인</a></li>
			<li><a href="#">회원가입</a></li>
		</ul>
	</header>
	<div>
		<xmp class="code"> </xmp>
		<label for="name">입력 : </label> <input type="text"
			autofocus="autofocus" id="name" class="long" value="홍길동" /> <br /> <input
			id="fsrange" class="long" type="range" min="1" max="100" step="1" />
		<output id="out">50</output>
		<p id="demo">홍길동</p>

		<script>
			const txtName=$("#name")
			const fsrange=$("#fsrange");
			const out=$("#out");
			const demo=$("#demo");
			
			const style=demo.css("font-size");
			
			out.text(style);			
			
			fsrange.val(parseInt(style));
			
			fsrange.on("input",function(){
				const size=$(this).val()+'px';
				out.text(size);
				demo.css("font-size",size);
			})
			
			txtName.on("keydown",function(event){
				if(event.key==='Enter'){
					demo.text(txtName.val());
				}
			})
			
			
		</script>
	</div>
</body>
</html>
