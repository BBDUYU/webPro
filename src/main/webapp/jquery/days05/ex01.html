<style>
	#container{

	#container > div{
		width:33%;

	#container > div >select{
		width:100%;
		height:200px;
	}
	#container > div > button{
		width:100%;
	}
</style>
</head>
<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>

  </ul>
</header>
<div>
  <xmp class="code">
    
  </xmp>
  <div id="container">
  	<div>
  		<select name="" id="leftCmb" multiple>
  			<option>김민배</option>
  			<option>오승종</option>
  			<option>이지혜</option>
  			<option>지영주</option>
  			<option>류지호</option>
  		</select>
  	</div>
  	<div>
  		<button id="btnRight">▶</button>
  		<button id="btnAllRight">▶▶</button>
  		<button id="btnLeft">◀</button>
  		<button id="btnAllLeft">◀◀</button>
  	</div>
  	<div>
  		 <select name="" id="rightCmb" multiple>
  		 </select>
  	</div>
  </div>
</div>
	<script>
		$("#container > div:nth-child(2) > button").first().on("click",function(){
			$("#leftCmb > option:selected").each(function(index,element){
				/* console.log(element); */
				/* $("#rightCmb").append(element); */
				/*
					jq method : append(), appendTo()
					부.append(자)
					자.appendTo(부)
				*/
				/* const clone=$(element).clone();
				$(clone).appendTo($("#rightCmb")); */
				$(element).clone().appendTo($("#rightCmb"));
			});
		});
		$("#container > div:nth-child(2) > button").eq(1).on("click",function(){
			$("#leftCmb > option").each(function(index,element){
				$(element).appendTo($("#rightCmb"));

			});
		});
	</script>
	
</body>
