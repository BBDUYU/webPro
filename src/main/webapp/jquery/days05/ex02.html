<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
    
  </xmp>
    <table id="tblDept">
     <thead>
        <tr>
           <th><input type="checkbox" class="all"> 모두 선택</th>
           <th>이름</th>
           <th>지역</th>
        </tr>
     </thead>
     <tbody>
        <tr>
           <td><input type="checkbox" id="ck1"></td>
           <td>Laudantium!</td>
           <td>Sint!</td>
        </tr>
        <tr>
           <td><input type="checkbox" id="ck2"></td>
           <td>Voluptatem?</td>
           <td>Animi!</td>
        </tr>
        <tr>
           <td><input type="checkbox" id="ck3"></td>
           <td>Architecto!</td>
           <td>Odit!</td>
        </tr>
        <tr>
           <td><input type="checkbox" id="ck4"></td>
           <td>Numquam!</td>
           <td>Molestiae.</td>
        </tr>
     </tbody>
     <tfoot>
        <tr>
           <td colspan="3" align="center">
             <button>선택 확인</button>
           </td>
        </tr>
     </tfoot>
  </table>
  
  <p id="demo"></p>
</div>
<script>
	//jq
	/* $("input[type=checkbox]") */
	$(":checkbox.all").on("click",function(){
		let count = $(":checkbox:not(.all)").length;
		let allCount = $(":checkbox:not(.all):checked").length;
		$(":checkbox:not(.all)").prop("checked",count==allCount?true:false);
	});
	$("button").on("click",function(){
		const ul=$("<ul></ul>");
		$(":checkbox:not(.all):checked").each(function(index,element){
			let id = element.id;
			let name = $(element).parent().next().text();
			let loc = $(element).parent().next().next().text();
			ul.append($(`<li>${id} / ${name} / ${loc}</li>`))
		});
		
		$("#demo").empty().append(ul);
	});
	
</script>

</body>
