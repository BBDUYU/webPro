  <p id="demo"></p>  
  <script>
  	function setCookie(){
  		let cname= $("#cookieName").val();
  		let cvalue= $("#cookieValue").val();
  		
  		let now = new Date();
  	    now.setDate(now.getDate() + 10);
  	    let expires = now.toUTCString();
  	    
  	    document.cookie = `${cname}=${escape(cvalue)}; expires=${expires}; path=/;`;
  	}
