<div>
  <xmp class="code">
   쿠키 생성, 수정, 삭제, 조회
   js 쿠키     document.cookie 속성 생성,읽기 등등
  </xmp>

  쿠키이름 : <input type="text" id="cookieName" autofocus="autofocus"><br>
  쿠키값 : <input type="text" id="cookieValue"><br>
  <br>
  <button onclick="setCookie()">쿠키생성</button>
  <button onclick="getAllCookies()">쿠키조회</button>
  <button onclick="getCookie()">쿠키확인</button>
  <button onclick="delCookie()">쿠키삭제</button>
  
  <p id="demo"></p>  
  
  <script>
  // 쿠키 생성
  function setCookie(){
     // 쿠키이름=쿠키값;_만료시점=날짜;_경로=경로값;_도메인=도메인명;_보안처리옵션
    let cname = $("#cookieName").val();
    let cvalue = $("#cookieValue").val();
    // (암기)
    // 쿠키의 값이 한글이 있는 경우 escape() 함수 사용해서 %u????? 변환해서 쿠키에 저장한다. 
    //                        unescape() 함수    
    let now = new Date();
    now.setDate(now.getDate() + 10);
    let expires = now.toUTCString();
    
    document.cookie = `${cname}=${escape(cvalue)}; expires=${expires}; path=/;`;
    
    $("#cookieName").val("");
    $("#cookieValue").val("");
  }
  
  function getAllCookies(){
     let cookies = document.cookie;
     $("#demo").html( cookies );
  }
  
  function getCookie(){
     let cname = $("#cookieName").val();
     
     // "color=red;_name=admin"
     let cookies = document.cookie;
     
     let cvalue ;
     const cookieArr = cookies.split(  /;\s/  );
     cookieArr.forEach( function (elem, index, array){
        // "color=red"        
        const cnvArr = elem.split("=");
        if( cnvArr[0] == cname ){
           // $("#cookieValue").val( unescape( cnvArr[1] ) );
           cvalue = unescape( cnvArr[1] );
        } 
     } );
     
     if (cvalue) {
        $("#cookieValue").val( cvalue );
   } else {
         alert("존재하지 않는 쿠키이름입니다.");
   }
     
  }
  function delCookie(){
	  //쿠키이름으로 만기날짜 과거로 해서 쿠키 생성
	  // 쿠키이름=쿠키값;_만료시점=날짜;_경로=경로값;_도메인=도메인명;_보안처리옵션
	    let cname = $("#cookieName").val();
	    let cvalue = $("#cookieValue").val();
	    // (암기)
	    // 쿠키의 값이 한글이 있는 경우 escape() 함수 사용해서 %u????? 변환해서 쿠키에 저장한다. 
	    //                        unescape() 함수    
	    let now = new Date();
	    now.setDate(now.getDate() - 10);
	    let expires = now.toUTCString();
	    
	    document.cookie = `${cname}=; expires=${expires}; path=/;`;
	    
	    $("#cookieName").val("");
	    $("#cookieValue").val("");
	  
	    // cookie.js
		
  }
  </script>
