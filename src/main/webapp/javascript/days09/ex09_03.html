<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
  	웹 api - 웹 서버에 http요청을 할 수 있음
  	(더이상 XMLHttpRequest가 필요 없음)
  	ES6이상 - fetch() 브라우저 지원
  	
    fetch_info.txt 추가
    
    웹 작업자(Work) api
    ㄴ 페이지의 성능에는 영향을 주지 않고 백그라운드에서 실행되는 js
  </xmp>
  <p id="demo"></p>
  
  <script>
  	let file = "fetch_info.txt";
  	//서버에 위의 파일요청해서 응답 p#demo 출력
  	fetch(file) 		//file 가져오기 명령함수 요청
  		.then(x=>x.text()) //then (그런다음)
  		// x는 요청해서 응답은 데이터 => 문자열 변환
  		.then(y=>document.getElementById("demo").innerHTML=y);
  		//그런다음 y
  </script>
</div>
</body>
