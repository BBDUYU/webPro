<div>
  <xmp class="code">
    BOM
    ㄴ window
    ㄴ screen - 사용자 화면에 대한 정보를 가지고 있는 객체
       screen.width 너비
       screen.height 높이
       
       screen.availWidth  실제 사용가능한 너비
       screen.availHeight 실제 사용가능한 높이
       
       screen.colorDepth 색 농도
       
  </xmp>
  <p id="demo"></p>
  <script>
  	let output=`
  		${screen.width} / ${screen.height}<br>
  		${screen.availWidth} / ${screen.availHeight}<br>
  		${screen.colorDepth}
  	$("p#demo").html(output);
  	`
  </script>
</div>
