<div>
  <xmp class="code">
    window.open() 		새창
    window.close() 		현재창 닫기
    window.moveTo() 	현재창 이동
    window.resizeTo() 	현재창 크기 조정
    
    문제 : 닫기(X)를 클릭후 새창열기를 하면 새창이 열리지 않는다
    	  창 닫기 버튼을 클릭후 새창열기를 하면 새창이 열리지 않음
  </xmp>
</div>
<button onclick="windowOpen()">새창열기</button>
<button onclick="windowClose()">창닫기</button>
<script>
   let newWin;
   
   function windowOpen(){
      let url = "ex02_02.html";
      let target = "";
      let windowFeatures = "left=100, top=200, width=600, height=500";
      if(!newWin){
      	newWin = window.open(url, target, windowFeatures);  
      }else{
    	  newWin.focus();
      }
   }
   function windowClose() {
	  if(newWin){
	      newWin.close();	  
	      newWin = undefined;
	  }
   }
</script>
