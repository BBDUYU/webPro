<script>
  $(function() {
   let cname = "bgimage"; // 쿠키이름
   
   let cvalue = getCookie(cname);
   
   if (!cvalue) {
      cvalue = "item01";
   }
   
   $(`#${cvalue}`).prop("checked",true);
   
   $("body").css("background-image", `url(../images/${cvalue}.gif)`);
   
   
// jquery selector
   // input[type=text]  == :text
   // input[type=radio] == :radio
   $(":radio[name=bgImages]").on("click", function (){
     cvalue = $(this).prop("id");
     setCookie(cname, cvalue);  // 쿠키 저장(수정)
     $("body").css("background-image", `url(../images/${cvalue}.gif)`);
   });
   
  });
</script>
