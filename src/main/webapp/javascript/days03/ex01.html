<!DOCTYPE html>
<html>
<head>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet" href="http://localhost/webPro/resources/cdn-main/example.css">
<script src="http://localhost/webPro/resources/cdn-main/example.js"></script>
</head>
<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">kEnik HOme</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
   
  </xmp>
  
  <input type="radio" name="group" value="Lorem">Lorem.<br>
  <input type="radio" name="group" value="Deserunt">Deserunt!<br>
  <input type="radio" name="group" value="Aspernatur" alt="Aspernatur.">Aspernatur.<br>
  <input type="radio" name="group" value="Quo">Quo.<br>
  <input type="radio" name="group" value="Debitis">Debitis.<br>
  <br>
  <button>실행</button>
  
  <p id="demo"></p>
  
</div>

<script>
  document.querySelector("body > div > button").onclick = function (){
	  let rValue,  rText;
	  // alert("이벤트 발생 확인!!!")
	  const radioList = document.querySelectorAll("input[type=radio][name=group]");
	  // alert( radioList.length );
	  for (var i = 0; i < radioList.length; i++) {
		if(  radioList[i].checked  ){
			rValue = radioList[i].value;
			// console.log(  radioList[i].nextSibling ) ; 
			rText = radioList[i].nextSibling.textContent;
			break;
		}
	  } // for
	  
	  //alert( rValue )
	  
	  // js  undefined   는 false 로 처리한다. (암기)
	  // if( rValue == undefined ){
	  if( !rValue ){  
		  alert("라디오 버튼을 체크하세요.");
		  return;
	  }
	  
	  document.querySelector("#demo").innerText = `${rValue} / ${rText}`;
  }
</script>
</body>
</html>
