   좋아하는 과목을 모두 선택하세요 ? 
  <br>
  <input type="checkbox" name="subject" id="kor" value="kor">
  <label for="kor">국어</label>
  <input type="checkbox" name="subject" id="eng" value="eng">
  <label for="eng">영어</label>
  <input type="checkbox" name="subject" id="mat" value="mat">
  <label for="mat">수학</label>
  <input type="checkbox" name="subject" id="pe" value="pe">
  <label for="pe">체육</label>  
  <br>
  <button>확인</button>
  <p id="demo"></p>   
  
</div>

<script>
  document.querySelector("body > div > button").onclick = function (){
	  let cValue,  lText; 
	  const checkboxList = document.querySelectorAll("input[type=checkbox][name=subject]");
	  // alert( checkboxList.length );
	  if( !checkboxList.length ){  
		  alert("체크박스를 체크하세요.");
		  return;
	  }
	  
	  let content = "<ul>";
	  for (var i = 0; i < checkboxList.length; i++) {
		if(  checkboxList[i].checked  ){
			cValue = checkboxList[i].value; 
			// <label for="kor">국어</label>
			lText = checkboxList[i].nextElementSibling.innerText;
			
			content += "<li>";
			content += `${cValue} / ${lText}`;
			content += "</li>";
		}
	  } // for
	  
	  content += "</ul>";
	  
	  document.querySelector("#demo").innerHTML = content;
  }
</script>
</body>
