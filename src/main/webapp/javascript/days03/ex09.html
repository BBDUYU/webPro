    나이를 저장하는 변수 선언 + input type="text" 입력
    실행 버튼 + 클릭
    p#demo 
       입력받은 나이가 30 살 이하 "young" 출력
                         초과 "old"   출력 
                         
     (  0살~ 130살 )                    
  </xmp>
  
  <input type="text" id="age" value="20">
  <br>
  <button>실행</button>
  <p id="demo"></p>
  
  <script>
 
  // 숫자인 경우 true 반환하는 함수
  function isNumber(str) {
	  return str.trim() !== "" && !isNaN(str);
  }
 
  $("button").on("click", function (){
	  let age = $("#age").val();
	  // alert( typeof age ); string
	  // 입력값에 대한 유효성 검사...
	  // 1) 숫자인지 체크
	  if( !isNumber(age) ){
		  alert("숫자만 입력하세요.");
		  $("#age").select();
		  return;
	  }
	  // 2) 0~130 체크
	  if ( !( age >= 0 && age <= 130) ) {
		  alert("0~130 숫자만 입력하세요.");
		  $("#age").select();
		  return;
	  }
	  
	  //
	  if (age <= 30) {
		$("p#demo").text("young");
	  } else {
			$("p#demo").text("old");
	  }
	  
  });
  
  </script>
