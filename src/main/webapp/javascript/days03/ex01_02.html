<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">kEnik HOme</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
   
  </xmp>
  
  <input type="radio" name="group" value="Lorem">Lorem.<br>
  <input type="radio" name="group" value="Deserunt">Deserunt!<br>
  <input type="radio" name="group" value="Aspernatur" alt="Aspernatur.">Aspernatur.<br>
  <input type="radio" name="group" value="Quo">Quo.<br>
  <input type="radio" name="group" value="Debitis">Debitis.<br>
  <br>
  <button>실행</button>
  
  <p id="demo"></p>
  
</div>

<script>
  document.querySelector("body > div > button").onclick = function (){
	  let rValue,  rText;
	  // alert("이벤트 발생 확인!!!")
	  const checkedRadio = document.querySelector("input[type=radio][name=group]:checked");
	  
	  // alert( checkedRadio );   null
	  // js 는 null도 false로 처리된다.
	  // if( checkedRadio == null ){  
	  if( !checkedRadio ){	  
		  alert("라디오 버튼을 체크하세요.");
		  return;
	  }
	  
	  rValue = checkedRadio.value;
	  rText = checkedRadio.nextSibling.textContent;
	  
	  document.querySelector("#demo").innerText = `${rValue} / ${rText}`;
  }
</script>
</body>
