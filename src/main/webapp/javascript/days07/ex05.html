<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>

<div>
  <xmp class="code">
    java 예외처리
    js
    	try-catch-finally
    	throw
    예) 필수 입력
    	숫자만 입력
    	>= 100 too high
    	<10   too low
  </xmp>
  <input type="text" id="msg" class="long" />
  <input type="button" value="test" />
  <p id="demo"></p>
</div>
<script>
	$(":button").on("click",function(){
		const msg=$("#msg").val();
		try {
			if (msg.trim()=="") {
				throw "empty";
			}
			if (isNaN(msg)) {
				throw "not a number";
			}
			let num=Number(msg);
			if(num>=100){
				throw "too high";
			}else if(num<10){
				throw "too low";
			}
			$("#demo").html(num);
		} catch (e) {
			$("#demo").html(`input is ${e}`);
		}
	})
</script>
</body>
</html>
