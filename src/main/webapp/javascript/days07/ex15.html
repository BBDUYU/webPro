<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
    setTimeout() 	/	setInterval()
    clearTimeout() 	/ 	clearInterval()
  </xmp>
  <h1 id="out"></h1>
  <button>setTimeout()</button>
  <button>clearTimeout()</button>
  <script>
  let timer;
  function dispTime(){
	  const now = new Date();
	  const milliseconds = String(now.getMilliseconds()).padStart(3,'0');
	  $("#out").html(`${now.toLocaleTimeString()}.${milliseconds}`);
	  
	  timer = setTimeout(dispTime,10);
  }
  
  
  	$("button").first().on("click",function(){
  		dispTime();
  	})
  	$("button").last().on("click",function(){
  		clearTimeout(timer);
  	})
  </script>
</div>
</body>
