    JSON
    Java Script Object Notation
    ㄴ 데이터를 저장하고 전송하기 위한 일반 텍스트 형식
    ㄴ json.org
    ㄴ 예
    	"{ 
    		"name" : "admin", 
    		"age" : 20, 
    		"gender" : true,
    		"color" : [],
    		"address" : null,
    		"car" : { }
    	}"
    	
  </xmp>
  
</div>
<script>
	//json 예제 코딩...
	//ex10_family
	//json 파일유형 ???.json
	//json 텍스트의 MIME유형 - "application/json"
	//json > xml
	//	1) 종료태그 X 2) 더짧음 3) 읽기 쓰기 더 빠름
	//	4) 배열을 사용할수 있음
	//	5) xml -> xml파서, json - js함수 파싱
	
	//js object
	const person ={
			name:"홍길동",
			age:20
	};
	//1) js object -> json변환
	const jsonPerson=JSON.stringify(person);
	//alert(typeof jsonPerson);
	
	//2) json -> js Object 변환
	const parsePerson=JSON.parse(jsonPerson);
	alert(parsePerson.name+"/"+parsePerson.age);
</script>
