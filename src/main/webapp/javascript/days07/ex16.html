<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Zerozhu HOme</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
    
  </xmp>
  
  <button>TypeWriter</button>
  <p id="demo"></p>
  
  <script>
     let content;
     let timer;
     let length;
     
     $("button").on("click", function () {
      // <body> 요소를 얻어 와서       content 
      // content = document.querySelector("body").innerText;
      // content = document.body.innerText;
      
      // <html> 요소를 얻어 와서       content 
      // content = document.documentElement.innerText;
      content = $("html").html();
      // alert(content);
      length = content.length;
      
      typeWriter();
      timer = setInterval(typeWriter, 50); // 0.05초 
   });
     
     let index = 0;
     
     function typeWriter() {
      let oneChar = content[index++];
      oneChar = oneChar=='\n' ? '<br>':oneChar;
      $("#demo").html($("#demo").html() + oneChar);
      
      $('html, body')
      	.animate({scrollTop:$("#demo").prop("scrollHeight")},50);
      if(index==length)clearInterval(timer);
   }
  </script>
  
</div>
</body>
