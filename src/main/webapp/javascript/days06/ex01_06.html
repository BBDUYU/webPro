	document.write(m.toString()+"<br>");
	/*

	//배열의 마지막 요소에ㅔ 추가하는 push() 메서드
	m.push(4);
	m.push(5);
	document.write(m.toString()+"<br>");
	
	//6 배열 맨앞에 추가 : 6 1 2 3 4 5
	m.unshift(6);
	document.write(m.toString()+"<br>");
	
	//첫 번째 요소를 제거 + 모든 요소를 1칸씩 앞으로
