<body>
<header>

  <ul>
    <li><a href="#">로그인</a></li>

<div>
  <xmp class="code">
    ex02_02.html
    버튼을 클릭하면
    로또번호 1,2,3,4,5,6
    오름차순으로 정렬해서 
    demo 요소에 출력..
    (중복 X)
    
    0.0 <= Math.random() < 1.0
    
    js   Set 표준 내장 객체
         Map 표준 내장 객체
  </xmp>
  
  <button>로또 번호 발생기</button>
  <p id="demo"></p>
  

<script>
  function getRndInt(min, max){ 
	return  Math.floor(Math.random() * (max - min + 1)) + min;
  } 

  $("button").on("click", function (){
	  const lotto = new Set();  // 1.   [] -> Set 사용
	  let n ;
	  while( lotto.size < 6 ){
		 n =  getRndInt(1, 45);
		lotto.add(n);
	  } // while
		  
	  // [] 정렬 	  
	  // lotto.sort((a,b) => a-b);
	  
	  // Set 정렬 X	 
	  // Set 순서 유지 X => 배열로 변환해서 정렬...
	  const lottoArr = Array.from(lotto);
	  lottoArr.sort((a,b)=>a-b);
	  
	  let content = "<ul><li>";	  
	  /*
	  for (let n of lotto) {
		content += `<li>${n}</li>`;
	  }
	  */
	  content += lottoArr.join("</li><li>");
	  content += "</li></ul>";
	  
	  $("#demo").html( content );
  });
</script>
  
</div>
