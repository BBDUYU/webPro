  <xmp class="code">
  	js 2차원 배열 - 다차원 배열  
  </xmp>
  
</div>
<script>
	//2차원 배열
	const m=[
		[1,2,3],
		[4,5,6],
		[7,8,9]
	];
	document.write(m.toString()+"<br>");
	document.write(m[0].toString()+"<br>");
	document.write(m[1].toString()+"<br>");
	document.write(m[2].toString()+"<br>");
	document.write(m[0][0]+"<br>");
	document.write(Array.isArray(m)+"<br>");
	document.write(Array.isArray(m[0])+"<br>");
	
	for (var i = 0; i < m.length; i++) {
		for (var j = 0; j < m[i].length; j++) {
			document.write(`[${m[i][j]}]`);
		}
		document.write("<br>");
	}
	//2차원 배열을 forEach()출력
	m.forEach((arr)=>{
		arr.forEach((element)=>{
			document.write(`<${element}>`);
		});
		document.write("<br>");
	});
</script>

<script>
	//배열.flat() 평탄화
	document.write(m.flat()+"<br>");
	
	//const a=[1,,,2];
	//	a.flat() [1,2] 빈요소는 제거
</script>
