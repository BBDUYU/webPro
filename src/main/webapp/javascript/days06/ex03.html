   js 배열 메서드 : keys()
                  entries() 
             
     Map 계열의 특징
      ㄴ  엔트리(Entry) =  key + value 한 쌍 
  </xmp>
  
<script>
  const fruits = ["Banana", "Orange", "Apple", "Mango"];
  // 배열   for of 구문 출력 : 반복객체 사용(배열, Set, Map  등등)
  /*
  for (let f of fruits) {
	document.write(`${f}<br>`);
  }
  */
  
  // 배열의 key == 인덱스
  /*
  for (let key of fruits.keys()) {
		document.write(`${key}- ${fruits[key]}<br>`);
  }
  */
  
  // js 엔트리 Entry 클래스,      배열  [ 키 , 값  ]
  for (const [k,v] of fruits.entries()) {
	  document.write(`${k} - ${v}<br>`);
  }
  
</script>
