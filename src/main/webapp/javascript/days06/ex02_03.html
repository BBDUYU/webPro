  로또 게임 횟수 선택 :
  <select id="cmbCnt"></select>
  <br>
  <button>로또 번호 발생기</button>
  <p id="demo"></p>
  
</div>

<script>
  for (var i = 1; i <= 25; i++) {
	$("#cmbCnt").append($(`<option>${i}</option>`));
  }
</script>
<script>
  function getRndInt(min, max){ 
	return  Math.floor(Math.random() * (max - min + 1)) + min;
  } 

  $("button").on("click", function (){
	  
	  // #demo 제거
	  // $("#demo").empty();
	  $("#demo").html("");
	  
	  const lottos = []; // set, set, set, set
	  let cnt = $("#cmbCnt").val();  // 게임횟수
	  
	  for (var i = 1; i <= cnt; i++) {
		  // begin
		  const lotto = new Set();  
		  let n ;
		  while( lotto.size < 6 ){
			 n =  getRndInt(1, 45);
			lotto.add(n);
		  } // while
		  // end
		  lottos.push(lotto);
	  } // for


	  // 게임횟수 만큼 반복으로 로또번호 출력.
	  let content = ""; 
		  
	  lottos.forEach( (s, i, arr) =>{
		
		  const lottoArr = Array.from(s);
		  lottoArr.sort((a,b)=>a-b);
		  
		  content += `${i+1} 게임 : `;
		  for ( var v of lottoArr) {
			  content += `${ v.toString().padStart(2, '0') }\t`;
		  } 
		  content += "<br>";
	  } ); 
	  
	  $("#demo").html( content );
  });
  
</script>
  

</body>
