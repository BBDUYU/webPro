    ex07.html
    [콜백함수 ( callback )]
    1. 다른 함수의 매개변수로 전달되는 함수
    2. 콜백함수를 사용하면 함수가 다른 함수를 호출 가능
  </xmp>
  
  <p id="demo"></p>
</div>
<script>
  function disp(msg) {
    $("#demo").html(msg);
  }
  
  // 함수는 선언하는 순서보다는 호출하는 순서대로 처리를 한다
  function myFirst() {
    disp("Hello");
  }
  function mySecond() {
    disp("Goodbye");
  }
  
  // 호출 순서
  myFirst();
  mySecond();
</script>
</body>
