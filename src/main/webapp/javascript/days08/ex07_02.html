    [콜백함수 ( callback )]
    1. 다른 함수의 매개변수로 전달되는 함수
    2. 콜백함수를 사용하면 함수가 다른 함수를 호출 가능
  </xmp>
  
  <p id="demo"></p>
</div>
<script>

	setTimeout(콜백함수,100);

  function disp(msg) {
    $("#demo").html(msg);
  }
  
  function sum(n1, n2, callback) {
   // return n1 + n2;
   let result = n1 + n2;
   callback(result);
  }
/*  
  function sum(n1, n2) {

*/
  
  // 함수를 매개변수로 가지는 sum 함수를 다시 선언.

  // let result = sum(10,20);
  // disp(result);
  
  // sum(10,35);
  sum(10,20,disp);
  
  function print(msg) {
   alert(msg);
  }
  sum(10,20,print);
  sum(100,200,(r)=>{
	  console.log(r);
  })
