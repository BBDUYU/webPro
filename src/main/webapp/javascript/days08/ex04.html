<script>
	function move(){
		let elem = document.querySelector(".animate");
		let pos=0;
		let timer=setInterval(()=>{
			if(pos==350) clearInterval(timer);
			pos++;
			elem.style.left=pos+"px";
			elem.style.top=pos+"px";
		},10);
	}
</script>
