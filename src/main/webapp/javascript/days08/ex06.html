<script>
	//전역변수
	//함수도 객체이다
	let counter = (function(){
		let count = 0;
		
		function plus(){
			count++;
		}
		
		function minus(){
			count--;
		}
		
		return {
			increment:plus,
			decrement:function(){
				minus();
			},
			value : function(){
				return count;
			}
		};
	})();
	document.write(`${counter.value()}<br>`);
	counter.increment();
	counter.increment();
	counter.increment();

	document.write(`${counter.value()}<br>`);
	counter.decrement();
	document.write(`${counter.value()}<br>`);

	
	
</script>
