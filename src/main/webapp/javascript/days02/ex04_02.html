<link rel="stylesheet" href="http://localhost/webPro/resources/cdn-main/example.css">
<script src="http://localhost/webPro/resources/cdn-main/example.js"></script>
</head>
<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
    
  </xmp>
  <label for="name">RED : </label><br />
  <input type="range" id="redrange" class="long" min="0" max="255" step="1"/><br />
  <input type="range" id="greenrange" class="long" min="0" max="255" step="1"/><br />
  <input type="range" id="bluerange" class="long" min="0" max="255" step="1"/><br />
  <p id="demo">홍길동</p>
</div>

<script>
  // rrange, greange, brange 각각 요소(객체)를 얻어와서 
  // 모두 일괄적으로 처리.. ( 수정 )
  const rgbRange = document.querySelectorAll('input[type=range][id$=range]');
  
  rgbRange.forEach(range=>{
     range.oninput = pelem_bgchange;
  });
   
  const pelem = document.getElementsByTagName("p")[0];
  pelem.style.height="200px";
  pelem.style.fontSize="30px";
  
  const pelem_bgcolor = getComputedStyle(pelem).backgroundColor;
   
  const rgbaArr =  pelem_bgcolor.match(/\d+/g).map(Number); 
  console.log( rgbaArr );
  rgbRange[0].value =  rgbaArr[0] ;
  rgbRange[1].value =  rgbaArr[1] ;
  rgbRange[2].value =  rgbaArr[2] ;
  
  function pelem_bgchange(){
     let cred = rgbRange[0].value;
     let cgreen = rgbRange[1].value;
     let cblue = rgbRange[2].value;
     
     pelem.style.backgroundColor = `RGB(${cred}, ${cgreen}, ${cblue})`;
     pelem.innerText = `RGB(${cred}, ${cgreen}, ${cblue})`;
  }
  </script>
</body>
</html>
