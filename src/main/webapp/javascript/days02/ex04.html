<header>

<div>
  <xmp class="code">
    
  </xmp>
  <label for="name">RED : </label><br />
  <input type="range" id="redrange" class="long" min="0" max="255" step="1"/><br />
  <input type="range" id="greenrange" class="long" min="0" max="255" step="1"/><br />
  <input type="range" id="bluerange" class="long" min="0" max="255" step="1"/><br />
  <p id="demo">홍길동</p>
</div>

<script>
   const rrange = document.querySelector("#redrange");
   const grange = document.querySelector("#greenrange");
   const brange = document.querySelector("#bluerange");
   
   const pelem = document.getElementsByTagName("p")[0];
   pelem.style.height = "200px";
   pelem.style.fontSize = "30px";
   
   const pelem_bgcolor = getComputedStyle(pelem).backgroundColor;
   // alert(pelem_bgcolor);
   
   /*
   const rgbArr = pelem_bgcolor.match(/\d+/g);
   console.log(rgbArr);
   
   rrange.value = Number(rgbArr[0]);
   grange.value = Number(rgbArr[1]);
   brange.value = Number(rgbArr[2]);
   */
   
   const rgbArr = pelem_bgcolor.match(/\d+/g).map(Number);
   console.log(rgbArr);
   
   rrange.value = rgbArr[0];
   grange.value = rgbArr[1];
   brange.value = rgbArr[2];
   
   function pelem_bgchage() {
      let cred = rrange.value;
      let cgreen = grange.value;
      let cblue = brange.value;
      
      pelem.style.backgroundColor = `RGB(${cred},${cgreen},${cblue})`;
       pelem.innerText = `RGB(${cred},${cgreen},${cblue})`;
       
   }
   rrange.oninput = pelem_bgchage;
    grange.oninput = pelem_bgchage;
    brange.oninput = pelem_bgchage;
</script>
</body>
