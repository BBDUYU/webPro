  /*
  	js함수 표현식
  	함수를 변수에 저장
  	변수에 저장된 함수를 함수표현식
  	함수의 매개변수로 함수를 전달할 수 있다
  	함수의 리턴값으로도 함수를 전달할 수 있다
  	
  	함수 표현식 : 콜백함수, 클로저, =>
    함수표현식은 익명 함수를 변수에 할당
    
    js 함수는 호이스팅 가능
    함수 표현식은 호이스팅 불가능
  */
  const sum = function (a,b){
	  return a+b;
  }
  //ES6(2015) js 화살표 함수 (람다식)
  //함수표현식을 더 짧은 구문으로 사용 가능
  /* const sum =(a,b)=>a+b; */
  
  /* alert(test(1,2));  test인식불가 */
  alert(sum(10,20));
  /* alert(test); */
  /*
  	js 자료형 8가지
  	string,number,bigint,boolean,
  	undefined, null, object, symbol
  	object - function, array, map, set, Date
  */
  /*
  셋 다 같은 식
  let hello=function(){
	  return "hello world";
  };
