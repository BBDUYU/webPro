	#container > div{
		width:33%;

	#container > div >select{
		width:100%;
		height:200px;
	}
	#container > div > button{
		width:100%;
	}

<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
    
  </xmp>
  <div id="container">
  	<div>
  		<select name="" id="leftCmb" multiple>
  			<option>김민배</option>
  			<option>오승종</option>
  			<option>이지혜</option>
  			<option>지영주</option>
  			<option>류지호</option>
  		</select>
  	</div>
  	<div>
  		<button id="btnRight">▶</button>
  		<button id="btnAllRight">▶▶</button>
  		<button id="btnLeft">◀</button>
  		<button id="btnAllLeft">◀◀</button>
  	</div>
  	<div>
  		 <select name="" id="rightCmb" multiple>
  		 </select>
  	</div>
  </div>
</div>
	<script>
		const leftCmb = document.querySelector("#leftCmb");
		const rightCmb = document.querySelector("#rightCmb");

		document.querySelector("#container > div:nth-child(2) > button:nth-child(1)").onclick = function() {
			// 1. 모든 option 들을 얻어오기
			const leftCmbOptions = document
					.querySelectorAll("#leftCmb > option");
			/*  console.log(leftCmbOptions.length); */
			for (var i = 0; i < leftCmbOptions.length; i++) {
				if (leftCmbOptions[i].selected) {
					//rightCmb.appendChild( new Option(leftCmbOptions[i].text) );

					//노드 복제와  요소 복제 차이점
					rightCmb.appendChild(leftCmbOptions[i].cloneNode(true));
					leftCmb.removeChild(leftCmbOptions[i]);
				}//if

			}//for

			// 2. 반복적으로 option이 selected 체크
			// 3. 선택된 option을 오른쪽 select에 option 추가
		}
		document.querySelector("#container > div:nth-child(2) > button:nth-child(2)").onclick = function() {
			// 1. 모든 option 들을 얻어오기
			const leftCmbOptions = document
					.querySelectorAll("#leftCmb > option");
			/*  console.log(leftCmbOptions.length); */
			for (var i = 0; i < leftCmbOptions.length; i++) {
				//노드 복제와  요소 복제 차이점
				rightCmb.appendChild(leftCmbOptions[i].cloneNode(true));
				leftCmb.removeChild(leftCmbOptions[i]);
			}
		}
	</script>
