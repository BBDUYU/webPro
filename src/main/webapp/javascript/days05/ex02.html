	const btnOK = document.querySelector("#tblDept > tfoot > tr > td > button");
	const demo = document.querySelector("#demo");

	btnOK.onclick = function (){
		const checkedCkbs = document.querySelectorAll("#tblDept > tbody input[id^='ck']:checked");
		let content="<ul>";
		for (var i = 0; i < checkedCkbs.length; i++) {
			const ckb=checkedCkbs[i];
			let name=ckb.parentElement.nextElementSibling.innerText;
			
			let loc=ckb.parentElement.nextElementSibling.nextElementSibling.innerText;
			
			content+=`<li>${ckb.id} / ${name} / ${loc}</li>`;
		}
		content+="</ul>";
		demo.innerHTML=content;
	}
