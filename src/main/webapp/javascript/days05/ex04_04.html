<script>
	$(":text").on("keydown",function(e){
		if(e.which==13){
			alert($(this).val());
			let msg=$(this).val();
			const names=msg.split("/");
			let ul=$("<ul></ul>");
			names.forEach(name=>{
				ul.append($(`<li>${name}</li>`));
			});
			$("#demo").append(ul);
			/* String msgArr[] = msg.split("구분자") */
		}
	});
</script>
